<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nunua Huduma - Tsh 4,000</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            text-align: center; 
            padding: 50px 20px; 
            background-color: #f4f4f9; 
        }
        .card { 
            background: white; 
            padding: 30px; 
            border-radius: 10px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            max-width: 400px; 
            margin: auto; 
        }
        h2 { color: #333; }
        .price { 
            font-size: 24px; 
            font-weight: bold; 
            color: #28a745; 
            margin: 20px 0; 
        }
        button { 
            background: #007bff; 
            color: white; 
            border: none; 
            padding: 15px 30px; 
            font-size: 18px; 
            border-radius: 5px; 
            cursor: pointer; 
            width: 100%; 
            transition: 0.3s;
        }
        button:hover { background: #0056b3; }
        #loading { 
            display: none; 
            color: #666; 
            margin-top: 15px; 
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="card">
        <h2>Ukurasa wa Malipo</h2>
        <p>Gusa kitufe hapo chini kukamilisha malipo yako salama.</p>
        <div class="price">Tsh 4,000</div>
        
        <button id="payButton" onclick="lipiaSasa()">Lipia Sasa (Tsh 4,000)</button>
        <p id="loading">Tafadhali subiri, mfumo unaandaa malipo yako...</p>
    </div>

    <script>
        async function lipiaSasa() {
            const btn = document.getElementById('payButton');
            const loading = document.getElementById('loading');
            
            // Ficha kitufe, onyesha ujumbe wa kusubiri
            btn.style.display = 'none';
            loading.style.display = 'block';

            try {
                // Hapa tunaita backend yetu ya Netlify
                const response = await fetch('/.netlify/functions/create-checkout', { method: 'POST' });
                const data = await response.json();

                if (data.checkout_url) {
                    // Mteja anapelekwa Abliner kulipa
                    window.location.href = data.checkout_url;
                } else {
                    alert("Samahani, tumeshindwa kuunganisha na mfumo wa malipo.");
                    console.error(data);
                    btn.style.display = 'block';
                    loading.style.display = 'none';
                }
            } catch (error) {
                alert("Kuna hitilafu ya mtandao. Tafadhali jaribu tena.");
                console.error(error);
                btn.style.display = 'block';
                loading.style.display = 'none';
            }
        }
    </script>
</body>
</html>
