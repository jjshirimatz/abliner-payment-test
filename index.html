
<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1255b7">
<title>DADYPLUS MOVIES | Malipo</title>

<style>
:root{
  --blue:#1255b7;
  --dark:#182942;
  --muted:#718198;
  --border:#dbe4f0;
}
*{box-sizing:border-box}
body{
  margin:0;
  min-height:100vh;
  padding:20px;
  display:flex;
  justify-content:center;
  align-items:center;
  background:#eef3fa;
  font-family:system-ui,-apple-system,Arial,sans-serif;
  color:var(--dark);
}
.card{
  width:100%;
  max-width:430px;
  background:#fff;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 12px 40px #19365b18;
}
.hero{
  padding:30px 20px 28px;
  background:var(--blue);
  color:#fff;
  text-align:center;
}
.logo{font-size:40px}
.hero h1{
  font-size:22px;
  margin:9px 0 6px;
}
.hero p{
  font-size:13px;
  margin:0;
  opacity:.88;
}
.content{padding:25px}
.price-label{
  text-align:center;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  letter-spacing:1px;
}
.price{
  text-align:center;
  color:var(--blue);
  font-size:36px;
  font-weight:800;
  margin:7px 0 21px;
}
.networks{
  padding:13px 10px;
  border-radius:12px;
  background:#eff5ff;
  color:#28548c;
  text-align:center;
  font-size:13px;
  margin-bottom:24px;
}
label{
  display:block;
  font-size:14px;
  font-weight:650;
  margin-bottom:10px;
}
input{
  display:block;
  width:100%;
  border:1.5px solid var(--border);
  border-radius:12px;
  padding:16px;
  font-size:17px;
  outline:none;
  background:#fff;
  color:var(--dark);
}
input:focus{
  border-color:var(--blue);
  box-shadow:0 0 0 3px #1255b714;
}
.hint{
  margin-top:9px;
  color:var(--muted);
  font-size:12px;
}
button{
  width:100%;
  padding:17px;
  border:0;
  border-radius:12px;
  background:var(--blue);
  color:#fff;
  font-size:16px;
  font-weight:750;
  cursor:pointer;
  margin-top:22px;
}
button:disabled{
  opacity:.65;
  cursor:not-allowed;
}
button:focus-visible{
  outline:3px solid #80b5ff;
  outline-offset:3px;
}
.status{
  display:none;
  margin-top:20px;
  padding:16px;
  border-radius:12px;
  font-size:14px;
  line-height:1.6;
  text-align:center;
  overflow-wrap:anywhere;
  white-space:pre-line;
}
.status.info{
  display:block;
  background:#eff5ff;
  color:#18529d;
}
.status.success{
  display:block;
  background:#e8f8ed;
  color:#176c38;
}
.status.error{
  display:block;
  background:#fff0f0;
  color:#b32626;
}
.status.warning{
  display:block;
  background:#fff7e8;
  color:#906018;
}
.spinner{
  display:inline-block;
  width:17px;
  height:17px;
  border:2px solid #ffffff70;
  border-top-color:white;
  border-radius:50%;
  animation:spin .8s linear infinite;
  vertical-align:middle;
  margin-right:8px;
}
@keyframes spin{
  to{transform:rotate(360deg)}
}
.reference{
  margin-top:13px;
  font-size:11px;
  color:var(--muted);
  text-align:center;
  overflow-wrap:anywhere;
}
.note{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:7px;
  color:var(--muted);
  font-size:12px;
  text-align:center;
  margin-top:23px;
}
.footer{
  border-top:1px solid #edf1f6;
  padding:16px;
  text-align:center;
  color:#8996a7;
  font-size:11px;
}
@media(max-width:380px){
  body{padding:12px}
  .content{padding:21px}
  .price{font-size:32px}
}
@media(prefers-reduced-motion:reduce){
  .spinner{animation:none}
}
</style>
</head>

<body>

<main class="card">
  <header class="hero">
    <div class="logo" aria-hidden="true">🎬</div>
    <h1>DADYPLUS MOVIES</h1>
    <p>Malipo kwa Mobile Money</p>
  </header>

  <section class="content">
    <div class="price-label">KIASI CHA MALIPO</div>
    <div class="price">TSh 4,000</div>

    <div class="networks">
      📱 M-Pesa • Mixx by Yas • Airtel Money
    </div>

    <form id="paymentForm">
      <label for="phone">
        Namba ya simu ya malipo
      </label>

      <input
        id="phone"
        name="phone"
        type="tel"
        inputmode="tel"
        autocomplete="tel"
        placeholder="07XXXXXXXX"
        maxlength="16"
        required
      >

      <div class="hint">
        Weka namba ya simu yenye huduma ya Mobile Money.
      </div>

      <button id="payButton" type="submit">
        LIPA TSh 4,000
      </button>
    </form>

    <div
      id="status"
      class="status"
      role="status"
      aria-live="polite"
    ></div>

    <div id="reference" class="reference"></div>

    <div class="note">
      🔒 Thibitisha malipo kwenye simu yako
    </div>
  </section>

  <footer class="footer">
    DADYPLUS MOVIES • Payment Gateway: Abliner
  </footer>
</main>

<script>
"use strict";

const API =
  "https://dadyplus-payments.kivule2024tz.workers.dev";

const PRICE = 4000;
const POLL_INTERVAL = 5000;
const MAX_CHECKS = 36;

const form = document.getElementById("paymentForm");
const button = document.getElementById("payButton");
const phoneInput = document.getElementById("phone");
const statusBox = document.getElementById("status");
const referenceBox = document.getElementById("reference");

let busy = false;
let currentReference = null;

function show(message, type = "info") {
  statusBox.className = "status " + type;
  statusBox.textContent = message;
}

function setBusy(value, text) {
  busy = value;
  button.disabled = value;
  phoneInput.disabled = value;
  button.textContent = text ||
    (value ? "Tafadhali subiri..." : "LIPA TSh 4,000");
}

function normalizePhone(value) {
  let phone = String(value || "")
    .replace(/[\s()+-]/g, "");

  if (/^0[67]\d{8}$/.test(phone)) {
    phone = "255" + phone.substring(1);
  } else if (/^[67]\d{8}$/.test(phone)) {
    phone = "255" + phone;
  }

  return /^255[67]\d{8}$/.test(phone)
    ? phone
    : null;
}

function sleep(ms) {
  return new Promise(resolve => setTimeout(resolve, ms));
}

async function apiRequest(path, options = {}) {
  const controller = new AbortController();
  const timeout = setTimeout(
    () => controller.abort(), 20000
  );

  try {
    const response = await fetch(API + path, {
      ...options,
      signal: controller.signal,
      cache: "no-store"
    });

    const data = await response.json();

    if (!response.ok) {
      throw new Error(
        data.message ||
        data.error ||
        "Ombi limeshindwa."
      );
    }

    return data;
  } finally {
    clearTimeout(timeout);
  }
}

async function checkPayment(reference) {
  for (let i = 0; i < MAX_CHECKS; i++) {
    await sleep(POLL_INTERVAL);

    let result;

    try {
      result = await apiRequest(
        "/payment-status?reference=" +
        encodeURIComponent(reference)
      );
    } catch (error) {
      console.warn("Status check failed:", error);
      continue;
    }

    if (result.status === "completed" &&
        result.paid === true &&
        Number(result.amount) === PRICE &&
        result.currency === "TZS") {

      show(
        "✅ MALIPO YAMEFANIKIWA!\n" +
        "Tumepokea malipo yako ya TSh 4,000.",
        "success"
      );

      setBusy(false);
      return;
    }

    if (result.status === "failed") {
      show(
        "❌ Malipo hayakufanikiwa.\n" +
        "Hakiki hali ya muamala kabla ya kujaribu tena.",
        "error"
      );

      setBusy(false);
      return;
    }
  }

  show(
    "⏳ Bado hatujapata uthibitisho wa mwisho.\n" +
    "Usianzishe malipo mengine mpaka uhakikishe " +
    "hali ya muamala wako.",
    "warning"
  );

  setBusy(false);
}

async function pay(event) {
  event.preventDefault();

  if (busy) return;

  const phone = normalizePhone(phoneInput.value);

  if (!phone) {
    show(
      "Tafadhali weka namba sahihi ya Tanzania, " +
      "mfano 0712345678.",
      "error"
    );
    phoneInput.focus();
    return;
  }

  setBusy(true, "Tunaandaa malipo...");
  referenceBox.textContent = "";

  show(
    "⏳ Tunaunganisha na mfumo wa malipo...",
    "info"
  );

  try {
    const result = await apiRequest(
      "/create-payment",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ phone })
      }
    );

    if (!result.success || !result.reference) {
      throw new Error(
        "Hatukupokea kumbukumbu ya muamala."
      );
    }

    currentReference = result.reference;

    referenceBox.textContent =
      "Kumbukumbu: " + currentReference;

    setBusy(true, "Inasubiri uthibitisho...");

    show(
      "📲 Ombi la TSh 4,000 limetumwa.\n" +
      "Angalia simu yako na uthibitishe malipo " +
      "kwa PIN yako ya Mobile Money.",
      "info"
    );

    await checkPayment(currentReference);

  } catch (error) {
    show(
      "⚠️ " +
      (error.name === "AbortError"
        ? "Muunganisho umechukua muda mrefu. " +
          "Hakiki kama ombi la malipo limefika " +
          "kwenye simu kabla ya kujaribu tena."
        : error.message),
      "warning"
    );

    setBusy(false);
  }
}

form.addEventListener("submit", pay);
</script>

</body>
</html>
